<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>개인정보 처리방침</title>
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/assets/doc.css" />
    <link rel="stylesheet" href="/assets/print.css" />
  </head>
  <body class="printpage">
    <!--
      개인정보 처리방침 — 로그인 없이 읽는다(로그인 화면 하단 링크).
      글은 설정(privacy_policy)에 저장된 것 — 업체·서버가 바뀌면 [설정 › 동의서 › 문구 수정] 에서 고친다.
    -->
    <div class="ptool">
      <div class="ptool__row">
        <button type="button" class="pbtn" id="p-back">← 뒤로</button>
        <strong class="ptool__name" id="p-center"></strong>
        <button type="button" class="pbtn" id="p-print">인쇄</button>
      </div>
    </div>
    <main class="paper" id="paper">
      <p class="paper__state">불러오는 중…</p>
    </main>
    <script type="module" src="/assets/privacy.js"></script>
  </body>
</html>
